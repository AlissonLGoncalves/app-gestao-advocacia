name: CI

on:
  push:
    branches:
      - main
      - task/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gestao_advocacia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gestao_advocacia/requirements-dev.txt

      - name: Install backend style tools
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gestao_advocacia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            gestao_advocacia/requirements.txt
            gestao_advocacia/requirements.lock

      # ci-greenfield: requirements.lock e gerado em Windows e nao inclui deps com
      # marker sys_platform != "win32" (ex: python-magic). Em Linux do CI, instalar
      # via requirements.txt (com markers respeitados). pip-audit continua usando o
      # lock para auditar versoes pinadas.
      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.lock

      - name: Install pytest-cov
        run: pip install pytest-cov

      - name: Run backend tests with coverage
        run: pytest tests --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=50

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: gestao_advocacia/coverage.xml
          if-no-files-found: warn

  backend-postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gestao_advocacia
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_gestao_advocacia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_gestao_advocacia_ci
      FLASK_APP: app.py
      FLASK_ENV: test
      CNJ_JOB_ENABLED: "false"
      DJEN_JOB_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            gestao_advocacia/requirements.txt
            gestao_advocacia/requirements.lock

      # ci-greenfield: requirements.lock e gerado em Windows e nao inclui deps com
      # marker sys_platform != "win32" (ex: python-magic). Em Linux do CI, instalar
      # via requirements.txt (com markers respeitados). pip-audit continua usando o
      # lock para auditar versoes pinadas.
      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations on PostgreSQL
        run: python -m flask db upgrade

      - name: Verify current migration head
        run: python -m flask db current

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gestao_advocacia_vite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gestao_advocacia_vite/package-lock.json

      # ci-greenfield: usar 'npm install' em vez de 'npm ci' porque o package-lock.json
      # eh gerado em Windows e nao contem deps optional Linux-only (ex: @emnapi/core)
      # que sao peer transitivas de libs nativas do Vite/esbuild. 'npm install' resolve
      # essas deps no Linux do CI sem quebrar; '--no-audit --prefer-offline' mantem o
      # cache do setup-node e evita o audit (que ja roda como step proprio abaixo).
      - name: Install frontend dependencies
        run: npm install --no-audit --prefer-offline

      - name: Run frontend security audit (high/critical)
        run: npm audit --audit-level=high

      - name: Run frontend lint
        run: npm run lint

      - name: Run prettier check
        run: npm run prettier:check

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: gestao_advocacia_vite/coverage
          if-no-files-found: warn
