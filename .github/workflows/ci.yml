name: CI

on:
  push:
    branches:
      - main
      - task/**
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao_advocacia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gestao_advocacia/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install pytest-cov
        run: pip install pytest-cov

      - name: Run backend tests with coverage
        run: pytest tests --cov=. --cov-report=term-missing --cov-fail-under=50

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao_advocacia_vite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gestao_advocacia_vite/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Cloudflare Worker config
        run: npm run deploy