name: CI

on:
  push:
    branches:
      - main
      - task/**
  pull_request:
    branches:
      - main

jobs:
  backend-style:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao_advocacia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gestao_advocacia/requirements-dev.txt

      - name: Install backend style tools
        run: pip install -r requirements-dev.txt

      - name: Ruff auto-fix
        run: ruff check . --fix

      - name: Black format
        run: black .

      - name: Fail if style generated diff
        run: git diff --exit-code

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao_advocacia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            gestao_advocacia/requirements.txt
            gestao_advocacia/requirements.lock

      - name: Install backend dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.lock

      - name: Run backend tests with coverage
        run: pytest tests --cov=. --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao_advocacia_vite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gestao_advocacia_vite/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend security audit (high/critical)
        run: npm audit --audit-level=high

      - name: Run frontend lint
        run: npm run lint

      - name: Run prettier check
        run: npm run prettier:check

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test