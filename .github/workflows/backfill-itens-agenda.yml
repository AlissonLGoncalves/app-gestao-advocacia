name: Backfill ItemAgenda (PR D2)

# Workflow manual pra rodar o backfill TarefaPrazo+EventoAgenda → ItemAgenda
# em producao. Usado UMA VEZ logo apos deploy do D2 — re-rodar eh seguro
# (idempotente via legacy_*_id), mas em condicoes normais nao precisa.
#
# Tambem util pra:
#   - Validar com dry-run antes de aplicar
#   - Re-sincronizar item_agenda se algum dual-write falhar e drift acumular
#   - Restringir backfill a um tenant especifico
#
# Trigger: workflow_dispatch (manual via UI ou `gh workflow run`).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Commit changes? Se false, roda dry-run (default seguro).'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      tenant_id:
        description: 'Restringe a um tenant_id (deixe vazio para todos).'
        required: false
        type: string
        default: ''
      batch_size:
        description: 'Tamanho do batch por commit (default 500).'
        required: false
        type: string
        default: '500'

permissions:
  contents: read

jobs:
  backfill:
    name: Run backfill script in Fly VM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Build backfill command
        id: cmd
        # Monta o comando python condicionalmente baseado nos inputs.
        # Sem `--apply` o script faz dry-run (default seguro).
        run: |
          CMD="python -m scripts.maintenance.backfill_itens_agenda"
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            CMD="$CMD --apply"
          fi
          if [[ -n "${{ inputs.tenant_id }}" ]]; then
            CMD="$CMD --tenant-id ${{ inputs.tenant_id }}"
          fi
          CMD="$CMD --batch-size ${{ inputs.batch_size }}"
          echo "command=$CMD" >> $GITHUB_OUTPUT
          echo "Command montado: $CMD"

      - name: Run backfill via flyctl ssh
        # Conecta na VM do backend e roda o script. A saida (JSON com
        # estatisticas) cai no log do Actions. --pty=false evita problemas
        # com terminal alocado em ambiente nao-interativo.
        run: |
          flyctl ssh console \
            --app app-gestao-advocacia \
            --pty=false \
            --command "${{ steps.cmd.outputs.command }}"

      - name: Summary
        if: always()
        run: |
          echo "## Backfill ItemAgenda concluido" >> $GITHUB_STEP_SUMMARY
          echo "- apply: \`${{ inputs.apply }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- tenant_id: \`${{ inputs.tenant_id || 'todos' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- batch_size: \`${{ inputs.batch_size }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Veja o log do step 'Run backfill via flyctl ssh' acima pro JSON com numeros." >> $GITHUB_STEP_SUMMARY
