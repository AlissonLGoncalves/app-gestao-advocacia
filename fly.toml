# ==============================================================================
# fly.toml - Configuracao do Fly.io para o backend Gestao Advocacia
# Regiao: gru (Guarulhos/Sao Paulo) - IP brasileiro para acessar ComunicaAPI/CNJ
# ==============================================================================
app = "app-gestao-advocacia"
primary_region = "gru"

[build]

[processes]
  # --timeout 600 (10 min) era band-aid quando /djen/sync rodava sincrono.
  # Apos B1 (2026-05-01) o sync vai para fila djen_sync_job processada pelo
  # processo djen-worker. Mantido em 600s como margem de seguranca para
  # outros endpoints longos (uploads grandes etc); --workers 2 garante que
  # health check responde mesmo se 1 worker estiver ocupado.
  app = "gunicorn -b 0.0.0.0:8080 --workers 2 --timeout 600 app:app"
  scheduler = "python -m scheduler_runner"
  # B1: processo dedicado para DJEN sync. Poll a cada 5s na tabela
  # djen_sync_job, pega FOR UPDATE SKIP LOCKED, processa via app_admin.
  # 1 maquina suficiente — fila de jobs e per-tenant com de-dup no enqueue.
  djen-worker = "python djen_worker.py"

[deploy]
  # Wrappamos com `sh -c` porque Fly nao invoca shell por padrao —
  # passa release_command como array de argv. Sem o sh -c, "KEY=val cmd"
  # vira tentativa de executar um binario chamado "KEY=val", machine
  # crasha com exit code -1.
  release_command = "sh -c 'USE_DATABASE_URL_ADMIN=true flask db upgrade'"

[env]
  PORT = "8080"
  FLASK_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Health check via /api/v1/health (issue #95): valida DB, alembic, namespaces.
  # path "/" antes era OK mas nao validava DB; mudanca em 2026-05-01 apos os
  # incidentes de RLS — queremos que o Fly marque a maquina nao-saudavel se DB
  # quebrar, nao apenas se o Flask boot ate.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Volume persistente para uploads de documentos
[[mounts]]
  source = "advocacia_data"
  destination = "/data"
  initial_size = "1gb"