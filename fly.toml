# ==============================================================================
# fly.toml — Configuração do Fly.io para o backend Gestão Advocacia
# Região: gru (Guarulhos/São Paulo) — IP brasileiro para acessar ComunicaAPI/CNJ
# ==============================================================================
app = "app-gestao-advocacia"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  FLASK_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Health check para garantir que o app está respondendo
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Volume persistente para uploads de documentos
[[mounts]]
  source = "advocacia_data"
  destination = "/data"
  initial_size = "1gb"