# ==============================================================================
# fly.toml - Configuracao do Fly.io para o backend Gestao Advocacia
# Regiao: gru (Guarulhos/Sao Paulo) - IP brasileiro para acessar ComunicaAPI/CNJ
# ==============================================================================
app = "app-gestao-advocacia"
primary_region = "gru"

[build]

[processes]
  # --timeout 600 (10 min) cobre operacoes longas como /djen/sync, que faz
  # multiplas chamadas externas ao ComunicaAPI/CNJ. Sem isso, gunicorn mata
  # o worker depois do default 30s e o cliente ve 500 + CORS missing
  # (worker morre antes de adicionar headers CORS na resposta).
  # --workers 2 mantem capacidade de servir health check enquanto outra
  # request esta em processamento longo (1 worker = stall completo).
  app = "gunicorn -b 0.0.0.0:8080 --workers 2 --timeout 600 app:app"
  scheduler = "python -m scheduler_runner"

[deploy]
  # Wrappamos com `sh -c` porque Fly nao invoca shell por padrao —
  # passa release_command como array de argv. Sem o sh -c, "KEY=val cmd"
  # vira tentativa de executar um binario chamado "KEY=val", machine
  # crasha com exit code -1.
  release_command = "sh -c 'USE_DATABASE_URL_ADMIN=true flask db upgrade'"

[env]
  PORT = "8080"
  FLASK_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Health check via /api/v1/health (issue #95): valida DB, alembic, namespaces.
  # path "/" antes era OK mas nao validava DB; mudanca em 2026-05-01 apos os
  # incidentes de RLS — queremos que o Fly marque a maquina nao-saudavel se DB
  # quebrar, nao apenas se o Flask boot ate.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Volume persistente para uploads de documentos
[[mounts]]
  source = "advocacia_data"
  destination = "/data"
  initial_size = "1gb"