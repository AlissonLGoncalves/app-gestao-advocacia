services:
  - type: web
    name: gestao-advocacia-api
    env: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-advocacia-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CNJ_JOB_ENABLED
        value: "false"
      - key: UPLOAD_FOLDER
        value: /mnt/data/uploads
    disk:
      name: uploads-disk
      mountPath: /mnt/data
      sizeGB: 1

databases:
  - name: gestao-advocacia-db
    plan: free
    region: oregon
