[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '(migrations/versions|venv|\.venv|\.git|__pycache__)'

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "migrations/versions",
  "venv",
  ".venv",
  ".git",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "migrations/*",
  "venv/*",
  ".venv/*",
  "tests/*",
  "seed.py",
  "diagnostico*.py",
  "verificar_isolation.py",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
